name: Build papers and reference artifact

# Observable one-shot path for PR-triggered verification.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - "paper/*.tex"
      - "paper/references.bib"
      - "simulation/**"
      - "Makefile"
      - ".github/workflows/bootstrap-artifacts.yml"

permissions:
  contents: write

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'schedule' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Assemble and verify source payloads
        run: |
          set -euo pipefail
          if [ -f .bootstrap/assemble.py ]; then
            python .bootstrap/assemble.py
          else
            echo "Source files are already assembled."
          fi
          echo "6f0d0d7f47df6bdb38ff41bca32b5b5108d7254f07825b069349e53f2c3ad5b7  paper/nashs_cage_rvcim_v0_1.tex" | sha256sum --check -
          test -s paper/nashs_cage_rvcim_v0_2.tex
          test -s paper/references.bib
          test -s simulation/rvcim_sim.py
      - name: Install TeX build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk biber texlive-bibtex-extra texlive-latex-extra \
            texlive-fonts-extra texlive-science texlive-pictures
      - name: Build both manuscript versions
        run: |
          set -euo pipefail
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error nashs_cage_rvcim_v0_1.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error nashs_cage_rvcim_v0_2.tex
          cd ..
          make paper-clean
          test -s paper/nashs_cage_rvcim_v0_1.pdf
          test -s paper/nashs_cage_rvcim_v0_2.pdf
      - name: Generate and verify reference artifact
        run: |
          set -euo pipefail
          make experiment
          make verify
      - name: Commit assembled release and remove bootstrap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation/rvcim_sim.py \
                  paper/nashs_cage_rvcim_v0_1.tex \
                  paper/nashs_cage_rvcim_v0_1.pdf \
                  paper/nashs_cage_rvcim_v0_2.tex \
                  paper/nashs_cage_rvcim_v0_2.pdf \
                  paper/references.bib \
                  artifacts/reference_run
          if [ -d .bootstrap ]; then
            git rm -r .bootstrap
          fi
          git rm .github/workflows/bootstrap-artifacts.yml
          git commit -m "Build manuscripts and reference artifact"
          git push origin HEAD:main
