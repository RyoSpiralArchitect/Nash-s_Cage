name: Build papers and reference artifact

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - "paper/*.tex"
      - "paper/references.bib"
      - "simulation/**"
      - "Makefile"
      - ".github/workflows/bootstrap-artifacts.yml"

permissions:
  contents: write

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'schedule' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Assemble source payloads when present
        run: |
          if [ -f .bootstrap/assemble.py ]; then
            python .bootstrap/assemble.py
          else
            echo "Source files are already assembled."
          fi
      - name: Install TeX build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk biber texlive-bibtex-extra texlive-latex-extra \
            texlive-fonts-extra texlive-science texlive-pictures
      - name: Build both manuscript versions
        run: |
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error nashs_cage_rvcim_v0_1.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error nashs_cage_rvcim_v0_2.tex
          cd ..
          make paper-clean
      - name: Generate and verify reference artifact
        run: |
          make experiment
          make verify
      - name: Commit assembled release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulation/rvcim_sim.py \
                  paper/nashs_cage_rvcim_v0_1.tex \
                  paper/nashs_cage_rvcim_v0_1.pdf \
                  paper/nashs_cage_rvcim_v0_2.tex \
                  paper/nashs_cage_rvcim_v0_2.pdf \
                  paper/references.bib \
                  artifacts/reference_run
          if [ -d .bootstrap ]; then
            git rm -r .bootstrap
          fi
          if git diff --cached --quiet; then
            echo "Generated files are already current."
          else
            git commit -m "Build manuscripts and reference artifact"
            git push origin HEAD:main
          fi
