name: One-shot verified RVCIM bootstrap

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nash-cage-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out staged payload
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/text.* | tr -d '\n\r ' | base64 --decode > /tmp/nash-payload.tar.xz
          echo "c1f21cea9f7e48ae4b1546ddf34e4744e00ec244fe4f987e4f2466657b607d8d  /tmp/nash-payload.tar.xz" | sha256sum --check -
          rm -rf /tmp/nash-final
          mkdir -p /tmp/nash-final
          xz --decompress --stdout /tmp/nash-payload.tar.xz | tar --extract --file=- --directory=/tmp/nash-final

      - name: Verify the release tree
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/nash-final
          echo "4ded46a5fee179182f40f671ab1345453dceda8e534b713eee775d628cf65d2e  paper/nashs_cage_rvcim_v0_1.pdf" | sha256sum --check -
          echo "6f0d0d7f47df6bdb38ff41bca32b5b5108d7254f07825b069349e53f2c3ad5b7  paper/nashs_cage_rvcim_v0_1.tex" | sha256sum --check -
          test -f paper/nashs_cage_rvcim_v0_2.tex
          test -f paper/nashs_cage_rvcim_v0_2.pdf
          test -f paper/references.bib
          test -f simulation/rvcim_sim.py
          test -f simulation/configs/minimal.json
          test -f .github/workflows/verify.yml
          make verify
          if make -n replay >/dev/null 2>&1; then make replay; fi

      - name: Publish final repository tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/nash-final/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Add manuscripts and executable RVCIM reference"
          git push origin HEAD:main
