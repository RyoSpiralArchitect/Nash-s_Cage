name: Verify

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exercise POSIX launcher
        run: ./rvcim explain
      - name: Verify committed release, tests, smoke run, and reference artifact
        run: make verify

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Exercise Windows launcher
        run: .\rvcim.cmd explain
      - name: Verify release and deterministic behavior without Make
        run: |
          python tools/verify_release.py --root . --manifest RELEASE_MANIFEST.json
          python -m py_compile simulation/__init__.py simulation/__main__.py simulation/rvcim_sim.py
          python -m py_compile tools/verify_release.py tools/verify_reference_replay.py
          python -m unittest -v simulation.tests.test_rvcim_sim
          python -m unittest -v tools.tests.test_verify_release
          .\rvcim.cmd smoke --config simulation\configs\minimal.json --episodes 4 --seed 101 --out .tmp\smoke-windows
          .\rvcim.cmd verify --receipt .tmp\smoke-windows\receipt.json
          python -m simulation verify --receipt artifacts\reference_run\receipt.json
          python tools/verify_reference_replay.py --root . --reference-dir artifacts\reference_run
