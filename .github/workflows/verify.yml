name: Verify

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile, test, and smoke when assembled
        run: |
          if [ -f simulation/rvcim_sim.py ]; then
            make compile
            make test
            make smoke
          else
            echo "Executable source is awaiting the assembly workflow."
          fi
      - name: Verify committed reference artifact when present
        run: |
          if [ -f artifacts/reference_run/receipt.json ]; then
            make verify-artifact
          else
            echo "Reference artifact is awaiting the assembly workflow."
          fi
