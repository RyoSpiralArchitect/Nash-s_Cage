name: materialize repository payload

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify repository bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d bootstrap/parts ]; then
            echo "No bootstrap payload remains."
            exit 0
          fi
          cat bootstrap/parts/part-* > /tmp/repo.tar.gz.b64
          base64 --decode /tmp/repo.tar.gz.b64 > /tmp/repo.tar.gz
          echo "0654d80256b1053f85461021627ae57c2daf761d4795a9b42458a2ee20f32c74  /tmp/repo.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/repo.tar.gz -C .
          rm -rf bootstrap .github/workflows/bootstrap.yml
      - name: Commit materialized files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Materialize executable F0 repository bundle"
          git push origin HEAD:main
